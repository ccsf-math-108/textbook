name: Preview Textbook PDF

# Manual, on-demand only. The PDF that actually gets published lives at
# https://ccsf-math-108.github.io/textbook/<PDF_NAME> and is built as part
# of the "Jupyter Book (via myst) GitHub Pages Deploy" workflow, on every
# push to main. Use *this* workflow to sanity-check a PDF build — e.g.
# after editing pdf-build/*.py, or content on a branch — without touching
# the live site. Run it from the Actions tab ("Run workflow"), pick your
# branch, then download the "textbook-pdf" artifact from the run.
on:
  workflow_dispatch:

concurrency:
  group: preview-pdf
  cancel-in-progress: true

env:
  PDF_NAME: Computational-and-Inferential-Thinking-CCSF-Math-108.pdf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pdf-build/requirements.txt

      # Same font families used in the print CSS (serif body text, sans
      # headings/footers) so the PDF looks the same as the deployed build.
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xfonts-scalable fonts-crosextra-carlito fonts-crosextra-caladea \
            fonts-dejavu-core fontconfig
          fc-cache -f

      - name: Install Python dependencies
        run: pip install -r pdf-build/requirements.txt

      - name: Install headless Chromium
        run: playwright install --with-deps chromium

      - name: Build PDF (pass 1 — render to learn page numbers)
        working-directory: pdf-build
        run: |
          python3 build_html.py ..
          python3 make_pdf.py pass1.pdf
          python3 finish_pdf.py pass1.pdf map

      - name: Build PDF (pass 2 — final, with page numbers + bookmarks)
        working-directory: pdf-build
        run: |
          python3 build_html.py ..
          python3 make_pdf.py pass2.pdf
          python3 finish_pdf.py pass2.pdf final "../${{ env.PDF_NAME }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: textbook-pdf
          path: ${{ env.PDF_NAME }}
          retention-days: 30
