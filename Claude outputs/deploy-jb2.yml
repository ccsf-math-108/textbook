name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  workflow_dispatch:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # Project page (ccsf-math-108.github.io/textbook), not a custom domain root
  BASE_URL: '/textbook'
  PDF_NAME: Computational-and-Inferential-Thinking-CCSF-Math-108.pdf

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install Jupyter Book (via myst)
        run: npm install -g jupyter-book
      - name: Build HTML Assets
        run: jupyter-book build --html
      - name: Copy Data Assets
        run: cp -r assets/data _build/html/

      # ---- PDF build, so it deploys alongside the HTML site -------------
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pdf-build/requirements.txt
      - name: Install PDF fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xfonts-scalable fonts-crosextra-carlito fonts-crosextra-caladea \
            fonts-dejavu-core fontconfig
          fc-cache -f
      - name: Install PDF build dependencies
        run: pip install -r pdf-build/requirements.txt
      - name: Install headless Chromium
        run: playwright install --with-deps chromium
      - name: Build PDF (pass 1 — render to learn page numbers)
        working-directory: pdf-build
        run: |
          python3 build_html.py ..
          python3 make_pdf.py pass1.pdf
          python3 finish_pdf.py pass1.pdf map
      - name: Build PDF (pass 2 — final, with page numbers + bookmarks)
        working-directory: pdf-build
        run: |
          python3 build_html.py ..
          python3 make_pdf.py pass2.pdf
          python3 finish_pdf.py pass2.pdf final "../${{ env.PDF_NAME }}"
      - name: Add PDF to the site output
        run: cp "${{ env.PDF_NAME }}" "_build/html/${{ env.PDF_NAME }}"
      # ---------------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
